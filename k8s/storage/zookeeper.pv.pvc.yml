
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zookeeper-pv
  namespace: chess
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /mnt/data/zookeeper

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-pvc
  namespace: chess
spec:
  resources:
    requests:
      storage: 2Gi 
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
